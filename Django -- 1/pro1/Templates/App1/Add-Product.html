<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

textarea{
    resize:none;
    height:90px;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

</style>
</head>

<body>

<div class="container">
    <h2>Add Product</h2>

    <form action="/app1/Add-Product" method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label>Product Name</label>
            <input name="p_name" type="text" placeholder="Enter product name" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="p_ds" placeholder="Enter product description"></textarea>
        </div>

        <div class="form-group">
            <label>Product Image</label>
            <input name="p_img" type="file" accept="image/*">
        </div>

        <div class="form-group">
            <label>Price</label>
            <input name="p_pri" type="text" placeholder="Enter price" required>
        </div>

        <button type="submit">Add Product</button>

    </form>
</div>

</body>
</html>
