<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#667eea,#764ba2);
}

.login-container{
    background:white;
    padding:40px;
    border-radius:12px;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.login-container h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
    color:#555;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#667eea;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#667eea;
    border:none;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#5a67d8;
}

.extra-links{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.extra-links a{
    text-decoration:none;
    color:#667eea;
}

</style>
</head>

<body>

<div class="login-container">

    <h2>Login</h2>

    <form action="/" method="POST">

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="ema" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="pwd" placeholder="Enter your password" required>
        </div>

        <button class="login-btn" type="submit">Login</button>

        {{ Err }}

        <div class="extra-links">
            <a href="/app1/Forget/1">Forgot Password?</a>
        </div>

    </form>

</div>

</body>
</html>
